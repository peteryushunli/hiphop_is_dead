[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiphop-analysis-hub"
version = "0.1.0"
description = "Reproducible studies of hip-hop music, language, and culture"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<25",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
hiphop = "hiphop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
